name: CI

# Continuous Integration for PhishGuard.
# Runs on every push to main or development and on every pull request, so a
# broken change is caught within minutes rather than at merge time.

on:
  push:
    branches: [ main, development ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webapp/requirements.txt
          pip install pytest ruff

      - name: Lint with ruff
        continue-on-error: true
        run: ruff check .

      - name: Byte-compile all Python files
        run: python -m compileall -q webapp tests *.py

      - name: Run unit tests
        run: pytest -q

      - name: Check documentation for em and en dashes
        continue-on-error: true
        run: |
          python - <<'PY'
          import pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.md"):
              if any(part in {".git", "node_modules"} for part in p.parts):
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              if "—" in text or "–" in text:
                  bad.append(str(p))
          if bad:
              print("Em or en dash found in:", bad)
              sys.exit(1)
          print("Documentation is dash clean")
          PY
